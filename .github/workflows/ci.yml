# Authored-by: Anand Palanisamy - anand@xeni.com

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Nightly E2E at 10:00 UTC (03:00 PDT / 02:00 PST)
    - cron: '0 10 * * *'
  workflow_dispatch:

jobs:
  lint-build-test:
    name: Lint + Build + Unit + Integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        # --max-warnings=0 on non-TODO rules; TODO(pN:) comments warn but don't
        # fail CI (per team policy — P1–P5 are tracked scaffold TODOs resolved
        # during implementation PRs). See .eslintrc.cjs.
        run: npm run lint

      - name: Type-check + Build
        run: npm run build

      - name: Test + coverage (unit + integration + reference-impl)
        # `npm test` runs vitest with the config `include` glob, covering
        # test/unit/, test/integration/, and reference-impl/tests/ in one
        # pass. Coverage is gated (thresholds in vitest.config.ts §14).
        run: npm test -- --coverage

  # E2E runs on a schedule, not on every PR (docs/DESIGN.md §14).
  # Reason: testnet HBAR cost + latency.
  #
  # `workflow_dispatch` also gated in so ops can trigger a run on-demand
  # after a bootstrap (e.g. post-M3/M4 cutover, before first 10:00 UTC
  # nightly fires). Matches the push+pull_request+schedule pattern: the
  # workflow is triggered, but only `e2e-nightly` is opt-in beyond the
  # default lint/build/test path.
  e2e-nightly:
    name: E2E on testnet-ci
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # Pre-flight gate (issue #22): probe every Mirror Node endpoint we
      # depend on with HTTP 200 + shape-invariant assertions before the
      # full E2E runs. If Mirror Node is down or has shape-shifted an
      # endpoint (the issue-#18 bug class), this step fails fast and
      # short-circuits the E2E step — much clearer signal than three
      # cryptic E2E failures. Lead Buddy's Q1 answer: pre-flight gate.
      - name: Mirror Node pre-flight smoke-check
        env:
          HEDERA_NETWORK: testnet
          HEDERA_AGENT_ID: ${{ secrets.TESTNET_CI_AGENT_ID }}
          HEDERA_XENI_TREASURY_ID: ${{ secrets.TESTNET_CI_TREASURY_ID }}
          HEDERA_XENI_AUDIT_TOPIC_ID: ${{ secrets.TESTNET_CI_AUDIT_TOPIC_ID }}
        run: npm run smoke:mirror-node

      - name: E2E tests
        env:
          NODE_ENV: test
          HEDERA_NETWORK: testnet
          # Env label used by bootstrap idempotency tests — must match the
          # label used when ops bootstrapped the testnet-ci topic + treasury
          # (so memo `xeni_audit_v1_testnet-ci` / `xeni_treasury_v1_testnet-ci`
          # verify correctly). See scripts/bootstrap-*.ts and
          # test/e2e/bootstrap-idempotency.e2e.test.ts.
          HEDERA_ENV_LABEL: testnet-ci
          # Operator credentials (HEDERA_OPERATOR_ID / HEDERA_OPERATOR_KEY)
          # are intentionally NOT set here (issue #21). The idempotent
          # re-use path in bootstrap-idempotency.e2e.test.ts builds its
          # own BootstrapEnv with a throwaway key; no other E2E test signs
          # on behalf of the operator. Leaving these unset keeps
          # warnIfColdKeyLeaked() silent during the nightly, preserving
          # the cold-key invariant end-to-end.
          HEDERA_AGENT_ID: ${{ secrets.TESTNET_CI_AGENT_ID }}
          HEDERA_AGENT_KEY: ${{ secrets.TESTNET_CI_AGENT_KEY }}
          HEDERA_XENI_TREASURY_ID: ${{ secrets.TESTNET_CI_TREASURY_ID }}
          HEDERA_XENI_AUDIT_TOPIC_ID: ${{ secrets.TESTNET_CI_AUDIT_TOPIC_ID }}
        run: npm run test:e2e
