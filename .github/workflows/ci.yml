name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Nightly E2E at 10:00 UTC (03:00 PDT / 02:00 PST)
    - cron: '0 10 * * *'
  workflow_dispatch:

jobs:
  lint-build-test:
    name: Lint + Build + Unit + Integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        # --max-warnings=0 on non-TODO rules; TODO(pN:) comments warn but don't
        # fail CI (per team policy — P1–P5 are tracked scaffold TODOs resolved
        # during implementation PRs). See .eslintrc.cjs.
        run: npm run lint

      - name: Type-check + Build
        run: npm run build

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests
        run: npm run test:integration

      - name: Coverage (informational)
        run: npm run test:unit -- --coverage
        continue-on-error: true

  # E2E runs on a schedule, not on every PR (docs/DESIGN.md §14).
  # Reason: testnet HBAR cost + latency.
  e2e-nightly:
    name: E2E on testnet-ci
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: E2E tests
        env:
          NODE_ENV: test
          HEDERA_NETWORK: testnet
          HEDERA_OPERATOR_ID: ${{ secrets.TESTNET_CI_OPERATOR_ID }}
          HEDERA_OPERATOR_KEY: ${{ secrets.TESTNET_CI_OPERATOR_KEY }}
          HEDERA_AGENT_ID: ${{ secrets.TESTNET_CI_AGENT_ID }}
          HEDERA_AGENT_KEY: ${{ secrets.TESTNET_CI_AGENT_KEY }}
          HEDERA_XENI_TREASURY_ID: ${{ secrets.TESTNET_CI_TREASURY_ID }}
          HEDERA_XENI_AUDIT_TOPIC_ID: ${{ secrets.TESTNET_CI_AUDIT_TOPIC_ID }}
        run: npm run test:e2e
